services:
  mongo:
    image: mongo:8.0
    container_name: crewgrid_mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    environment:
      - GLIBC_TUNABLES=glibc.pthread.rseq=1
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s

volumes:
  mongo_data:

