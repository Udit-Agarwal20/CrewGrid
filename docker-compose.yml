services:
  mongo:
    image: mongo:8.0
    container_name: crewgrid_mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    environment:
      - GLIBC_TUNABLES=glibc.pthread.rseq=1
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}).ok }"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 2s

volumes:
  mongo_data:

