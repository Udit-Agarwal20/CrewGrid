name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-integration:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start MongoDB replica set
        run: |
          docker compose up -d --wait
          # Initiate replica set if not already done
          docker exec crewgrid_mongo mongosh --quiet --eval '
            try {
              const status = rs.status();
              if (status.ok === 1) {
                console.log("Replica set already initialized");
              }
            } catch (e) {
              const res = rs.initiate({
                _id: "rs0",
                members: [{ _id: 0, host: "127.0.0.1:27017" }]
              });
              console.log("Replica set initiated:", JSON.stringify(res));
            }
          '

          # Wait for PRIMARY state
          for i in {1..30}; do
            IS_PRIMARY=$(docker exec crewgrid_mongo mongosh --quiet --eval 'db.isMaster().ismaster' 2>/dev/null || echo "false")
            if [ "$IS_PRIMARY" = "true" ]; then
              echo "MongoDB replica set is PRIMARY"
              break
            fi
            sleep 1
          done

          # Verify replica set status
          docker exec crewgrid_mongo mongosh --quiet --eval '
            const status = rs.status();
            if (status.ok !== 1) {
              console.error("Replica set status error:", JSON.stringify(status));
              process.exit(1);
            }
            console.log("Replica set is healthy with", status.members.length, "member(s)");
          ' || (docker logs crewgrid_mongo && exit 1)

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install -g pnpm@11.25.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production Build
        run: pnpm -r build

      - name: Lint
        run: pnpm -r lint

      - name: Strict Typecheck
        run: pnpm -r typecheck

      - name: Replica Set Transaction Smoke Test
        env:
          MONGODB_URI: "mongodb://127.0.0.1:27017/crewgrid_test?replicaSet=rs0&directConnection=true"
          MONGODB_DB: "crewgrid_test"
        run: pnpm test:smoke

      - name: API Integration Tests
        env:
          MONGODB_URI: "mongodb://127.0.0.1:27017/crewgrid_test?replicaSet=rs0&directConnection=true"
          MONGODB_DB: "crewgrid_test"
          NODE_ENV: "test"
          APP_ORIGIN: "http://localhost:5173"
        run: pnpm test:api

      - name: Verify Invariants
        env:
          MONGODB_URI: "mongodb://127.0.0.1:27017/crewgrid_test?replicaSet=rs0&directConnection=true"
          MONGODB_DB: "crewgrid_test"
        run: pnpm verify:invariants

      - name: Web Unit Tests
        run: pnpm --filter @crewgrid/web test

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Browser End-to-End Tests
        run: pnpm test:e2e
